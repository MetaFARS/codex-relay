name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ── PyPI wheels (multi-platform via maturin-action) ───────────────────────
  build-wheels:
    name: wheel ${{ matrix.platform.artifact }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: "2_17"
            artifact: linux-x86_64
            docker_platform: linux/amd64
            test_image: quay.io/pypa/manylinux2014_x86_64
            python_command: /opt/python/cp311-cp311/bin/python
            binary_command: /opt/python/cp311-cp311/bin/codex-relay
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: "2_17"
            artifact: linux-aarch64
            docker_platform: linux/arm64
            test_image: quay.io/pypa/manylinux2014_aarch64
            python_command: /opt/python/cp311-cp311/bin/python
            binary_command: /opt/python/cp311-cp311/bin/codex-relay
            cflags: -D__ARM_ARCH=8
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: musllinux_1_2
            artifact: musllinux-x86_64
            docker_platform: linux/amd64
            test_image: python:3.11-alpine
            python_command: python
            binary_command: codex-relay
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: musllinux_1_2
            artifact: musllinux-aarch64
            docker_platform: linux/arm64
            test_image: python:3.11-alpine
            python_command: python
            binary_command: codex-relay
          - runner: macos-15-intel
            target: x86_64
            manylinux: "off"
            artifact: macos-x86_64
          - runner: macos-latest
            target: aarch64
            manylinux: "off"
            artifact: macos-aarch64
          - runner: windows-latest
            target: x64
            manylinux: "off"
            artifact: windows-x86_64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            manylinux: "off"
            artifact: windows-aarch64
            python_arch: arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Enable Linux ARM64 emulation
        if: runner.os == 'Linux' && matrix.platform.target == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.platform.cflags }}
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Smoke-test Linux wheel
        if: runner.os == 'Linux'
        run: >-
          docker run --rm --platform ${{ matrix.platform.docker_platform }}
          -v "${{ github.workspace }}/dist:/dist:ro"
          ${{ matrix.platform.test_image }}
          sh -c '${{ matrix.platform.python_command }} -m pip install /dist/*.whl && ${{ matrix.platform.python_command }} -m pip check && ${{ matrix.platform.binary_command }} --version'
      - name: Set up Python on macOS
        if: runner.os == 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Set up Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.platform.python_arch }}
      - name: Smoke-test macOS wheel
        if: runner.os == 'macOS'
        run: python -m pip install dist/*.whl && python -m pip check && codex-relay --version
      - name: Smoke-test Windows wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install $wheel
          python -m pip check
          codex-relay --version
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.artifact }}
          path: dist

  windows-python-smoke:
    needs: build-wheels
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-x86_64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install and run the same wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install $wheel
          python -m pip check
          codex-relay --version

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-crates:
    needs: [build-wheels, windows-python-smoke, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    needs: [build-wheels, windows-python-smoke, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (no token needed)
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
